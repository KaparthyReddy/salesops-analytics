[project]
name = "salesops-analytics"
version = "0.1.0"
description = "End-to-end sales & customer analytics pipeline with a Power BI reporting layer."
requires-python = ">=3.11"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
